on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # 4AM every monday, to catch changes in dependencies
    - cron: '0 4 * * 1'
  workflow_dispatch:

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    if: "!contains(github.event.head_commit.message, 'ci skip')"
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: windows-latest, r: 'devel'}
          - {os: windows-latest, r: 'oldrel-1'}
          - {os: macOS-latest,   r: 'release'}
          - {os: ubuntu-latest,  r: 'devel'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Fix Homebrew gettext (keg-only) linkage for fontconfig
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/.R
          echo "LDFLAGS += -L$(brew --prefix gettext)/lib" >> ~/.R/Makevars
          echo "CPPFLAGS += -I$(brew --prefix gettext)/include" >> ~/.R/Makevars

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
