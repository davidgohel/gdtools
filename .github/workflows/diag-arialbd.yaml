# Temporary diagnostic workflow for PR #85, to be removed.
on:
  push:
    branches:
      - rd/no-cairo

name: diag-arialbd

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload

      - name: Font file versions
        shell: pwsh
        run: |
          Get-Item C:\Windows\Fonts\arial.ttf, C:\Windows\Fonts\arialbd.ttf |
            ForEach-Object { "{0}  {1}  {2}" -f $_.Name, $_.VersionInfo.FileVersion, $_.Length }

      - name: Diagnostic
        run: Rscript .github/diag/arialbd.R
